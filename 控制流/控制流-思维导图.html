<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust 控制流 · 思维导图</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif; }
  #app { position: relative; width: 100%; height: 100%; }
  #mindmap { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; left: 14px; top: 12px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(6px);
    border: 1px solid #e3e8ef; border-radius: 10px;
    padding: 9px 11px; width: 300px;
    box-shadow: 0 6px 22px rgba(16,24,40,.10);
    transition: opacity .25s, transform .25s;
  }
  #hud.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }
  #hud .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #hud .brand {
    font-size: 9.5px; font-weight: 600; letter-spacing: .4px;
    color: #1570ef; background: #eff8ff; border: 1px solid #b2ddff;
    border-radius: 999px; padding: 1px 7px; white-space: nowrap;
  }
  #hud .stat { font-size: 10px; color: #98a2b3; white-space: nowrap; }
  #hud h1 { margin: 0; font-size: 13.5px; color: #101828; }
  #hud p { margin: 0; font-size: 10.5px; line-height: 1.55; color: #667085; }
  #hud kbd {
    background: #f2f4f7; border: 1px solid #d0d5dd; border-bottom-width: 2px;
    border-radius: 3px; padding: 0 4px; font-size: 10px; color: #344054;
    font-family: ui-monospace, Consolas, monospace;
  }
  #hud a { color: #1570ef; text-decoration: none; }
  #hud a:hover { text-decoration: underline; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  .row button {
    font: inherit; font-size: 9.5px; padding: 3px 6px; cursor: pointer; white-space: nowrap;
    border: 1px solid #d0d5dd; background: #fff; border-radius: 5px; color: #344054;
  }
  .row button:hover { background: #f9fafb; border-color: #98a2b3; }
  .row button:active { background: #f2f4f7; }
  #hint { font-size: 10px; color: #98a2b3; }

  #status {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #fff; z-index: 20; text-align: center; padding: 24px;
  }
  #status.hidden { display: none; }
  #status .box { max-width: 620px; font-size: 13.5px; color: #475467; line-height: 1.85; }
  #status .box b { color: #101828; }
  #status code {
    background: #f2f4f7; padding: 1px 5px; border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
  }
</style>
</head>
<body>
<div id="app">
  <svg id="mindmap"></svg>

  <div id="hud">
    <div class="topbar">
      <span class="brand">RUST · CONTROL FLOW</span>
      <span class="stat" id="stat">—</span>
    </div>
    <h1>Rust 控制流 · 语法与注意事项</h1>
    <p>
      <kbd>滚轮</kbd> 缩放 · <kbd>拖拽</kbd> 平移<br>
      <kbd>点击圆点/文字</kbd> 折叠展开 · <kbd>H</kbd> 隐藏面板
    </p>
    <div class="row">
      <button id="btn-collapse">只看主干</button>
      <button id="btn-l2">展开二级</button>
      <button id="btn-expand">全部展开</button>
      <button id="btn-fit">适应窗口</button>
    </div>
    <div class="row">
      <button id="btn-png">导出 PNG</button>
      <button id="btn-svg">导出 SVG</button>
    </div>
    <p id="hint">默认只展开到章节级；点圆点逐层展开，或用上面的按钮。<br>
      离线打不开？用 VS Code 的 <a href="https://marketplace.visualstudio.com/items?itemName=gera2ld.markmap-vscode" target="_blank" rel="noreferrer">Markmap 插件</a>打开
      <code>控制流-思维导图.mindmap.md</code></p>
  </div>

  <div id="status"><div class="box">正在加载思维导图渲染库…</div></div>
</div>

<script>
  window.__mmFallback = function (msg) {
    var el = document.getElementById('status');
    el.classList.remove('hidden');
    el.querySelector('.box').innerHTML =
      '<b>无法加载思维导图渲染库</b><br>' + msg +
      '<br><br>通常是因为当前环境访问不了 CDN（离线）。<br>' +
      '替代方案：用 VS Code 的 <code>Markmap</code> 插件打开同目录下的 ' +
      '<code>控制流-思维导图.mindmap.md</code>，' +
      '或把它粘到 <a href="https://markmap.js.org/repl" target="_blank" rel="noreferrer">markmap.js.org/repl</a>。';
  };
  window.__mmDecode = function () {
    var b64 = document.getElementById('mm-data').textContent.trim();
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  };
</script>

    });

    if (typeof d3 === 'undefined') return window.__mmFallback('d3 未加载。');
    if (typeof markmap === 'undefined' || !markmap.Transformer) return window.__mmFallback('markmap-lib 未加载。');
    if (!markmap.Markmap) return window.__mmFallback('markmap-view 未加载。');

    var markdown = window.__mmDecode();
    var transformed = new markmap.Transformer().transform(markdown);
    var data = transformed.root;

    var INITIAL_LEVEL = 2;   // 2 = 只展开到「章节」这一层（根节点算第 1 层）
    var mm = markmap.Markmap.create('#mindmap', {
      autoFit: true,          // fit 在数据渲染完成之后执行
      duration: 300,
      spacingVertical: 9,
      spacingHorizontal: 85,
      paddingX: 15,
      maxWidth: 330,
      colorFreezeLevel: 2,
      initialExpandLevel: INITIAL_LEVEL,
      color: markmap.defaultColorFn
    }, data);

    document.getElementById('status').classList.add('hidden');

    // 统计节点数
    var count = 0, maxDepth = 0;
    (function walk(n, d) {
      count++; if (d > maxDepth) maxDepth = d;
      (n.children || []).forEach(function (c) { walk(c, d + 1); });
    })(data, 1);
    document.getElementById('stat').textContent = (count - 1) + ' 个知识点 · ' + maxDepth + ' 层';

    // ---- 折叠控制 ----
    // 注意：不能用 mm.setData()，因为它会用 initialExpandLevel 重新计算并覆盖 fold
    function setDepth(targetMin, targetMax) {
      (function walk(n) {
        var d = n.state ? n.state.depth : 1;
        var hasKids = n.children && n.children.length;
        n.payload = Object.assign({}, n.payload, {
          fold: hasKids && d >= targetMin && d < targetMax ? 1 : 0
        });
        (n.children || []).forEach(walk);
      })(data);
      mm.renderData();
    }
    function fitSoon() {
      [60, 400, 900].forEach(function (t) { setTimeout(function () { mm.fit(); }, t); });
    }
    var collapseBtn = document.getElementById('btn-collapse');
    var l2Btn = document.getElementById('btn-l2');
    var expandBtn = document.getElementById('btn-expand');
    var fitBtn = document.getElementById('btn-fit');

    collapseBtn.onclick = function () { setDepth(2, 99); fitSoon(); };  // 只留章节
    l2Btn.onclick = function () { setDepth(3, 99); fitSoon(); };        // 展开章节下的小节
    expandBtn.onclick = function () { setDepth(99, 99); fitSoon(); };   // 全部展开
    fitBtn.onclick = function () { mm.fit(); };

    // ---- 导出 ----
    function download(blob, name) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
    var svg = document.getElementById('mindmap');
    var CSS = 'svg{background:#fff;color:#101828;font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;}';

    // 生成一张"整图、无缩放、带样式"的 SVG 副本
    function makeExportSvg() {
      var clone = svg.cloneNode(true);
      var style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = CSS;
      clone.insertBefore(style, clone.firstChild);

      var pad = 24, w = svg.clientWidth, h = svg.clientHeight, ox = 0, oy = 0;
      try {
        var b = svg.querySelector('g').getBBox();
        if (b && b.width && b.height) {
          w = b.width + pad * 2; h = b.height + pad * 2;
          ox = b.x - pad; oy = b.y - pad;
        }
      } catch (e) { /* 退化为视口尺寸 */ }
      clone.setAttribute('viewBox', ox + ' ' + oy + ' ' + w + ' ' + h);
      clone.setAttribute('width', w);
      clone.setAttribute('height', h);
      var g = clone.querySelector('g');
      if (g) g.removeAttribute('transform');   // 交给 viewBox 定位
      return { svg: clone, w: w, h: h };
    }

    document.getElementById('btn-svg').onclick = function () {
      var ex = makeExportSvg();
      download(new Blob([new XMLSerializer().serializeToString(ex.svg)],
        { type: 'image/svg+xml;charset=utf-8' }), 'Rust控制流-思维导图.svg');
    };

    document.getElementById('btn-png').onclick = function () {
      var btn = this;
      var old = btn.textContent;
      btn.textContent = '导出中…';
      btn.disabled = true;
      function done() { btn.textContent = old; btn.disabled = false; }

      var ex = makeExportSvg();
      var scale = Math.min(2, Math.max(1, 3600 / ex.w));
      // 必须用 data URL：blob URL 会污染 canvas，导致 toBlob 抛 SecurityError
      var svgStr = new XMLSerializer().serializeToString(ex.svg);
      var dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);

      var img = new Image();
      img.onload = function () {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = Math.round(ex.w * scale);
          canvas.height = Math.round(ex.h * scale);
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(function (blob) {
            if (blob) download(blob, 'Rust控制流-思维导图.png');
            else alert('PNG 导出失败，请改用「导出 SVG」。');
            done();
          }, 'image/png');
        } catch (e) {
          alert('PNG 导出失败（' + e.message + '），请改用「导出 SVG」。');
          done();
        }
      };
      img.onerror = function () {
        alert('PNG 导出失败，请改用「导出 SVG」。');
        done();
      };
      img.src = dataUrl;
    };

    // ---- H 键隐藏面板 ----
    window.addEventListener('keydown', function (e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      if (e.key === 'h' || e.key === 'H') {
        document.getElementById('hud').classList.toggle('hidden');
      }
    });

    window.__mm = mm;   // 便于调试
  }

  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);

  // 6 秒后仍未渲染成功 → 给出降级提示（render 后 status 会被隐藏）
  setTimeout(function () {
    var el = document.getElementById('status');
    if (!el.classList.contains('hidden')) {
      window.__mmFallback('加载超时（6 秒）。');
    }
  }, 6000);
})();
</script>
</body>
</html>
